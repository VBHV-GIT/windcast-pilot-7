server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Root directory containing built static assets
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression for fast delivery of web bundles
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # Reverse proxy API calls to the backend service inside Docker network
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # SPA routing: fallback to index.html for client-side React routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets efficiently
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|otf)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # Custom healthcheck endpoint for NGINX itself
    location = /healthz {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
